name: Release tagged build

on:
  push:
    tags: [ '*' ]

permissions:
  contents: write

jobs:
  validate:
    name: Verify main CI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { data: commit } = await github.rest.repos.getCommit({
              ...context.repo, ref: context.ref
            });
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${commit.sha}...main`
            });
            if (!['ahead', 'identical'].includes(comparison.status)) {
              throw new Error('Release tags must point to commits merged into main.');
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci.yml', branch: 'main',
              event: 'push', head_sha: commit.sha, per_page: 1
            });
            const run = data.workflow_runs[0];
            if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error('Wait for this commit to pass CI on main before releasing.');
            }
            core.info(`Release commit ${commit.sha} passed main CI: ${run.html_url}`);

  release-tags:
    needs: validate
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/release-tags.yml@master
    secrets: inherit
